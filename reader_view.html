<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    #progress-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(128, 128, 128, 0.2);
      z-index: 9999;
    }
    #progress-bar {
      width: 0%;
      height: 100%;
      background-color: #ff4b4b;
      transition: width 0.1s ease-out;
    }

    #toolbar {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: #f8f9fa;
      border-bottom: 1px solid #e2e8f0;
      scrollbar-width: none; /* Hide on Firefox */
    }
    #toolbar::-webkit-scrollbar {
      display: none; /* Hide on Chrome/Safari */
    }

    .ctrl-btn, .speed-btn {
      flex-shrink: 0;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #1e293b;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .ctrl-btn:active, .speed-btn:active {
      transform: scale(0.97);
    }
    .speed-btn.active {
      background: #ff4b4b;
      color: #ffffff;
      border-color: #ff4b4b;
    }
    .speed-group {
      display: flex;
      flex-shrink: 0;
      gap: 4px;
    }

    #settings-panel {
      display: none;
      position: absolute;
      left: 8px;
      right: 8px;
      max-width: 440px;
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 14px;
      z-index: 5000;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      max-height: 80vh;
      overflow-y: auto;
    }
    #settings-panel.open { 
      display: block; 
    }
    #settings-panel label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #475569;
      margin: 12px 0 4px 0;
    }
    #settings-panel label:first-child { 
      margin-top: 0; 
    }
    #settings-panel select {
      width: 100%;
      font-size: 14px;
      padding: 8px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #f8f9fa;
      color: #1e293b;
    }
    #settings-panel input[type=range] { 
      width: 100%; 
      accent-color: #ff4b4b;
    }
    #sleepStatus {
      font-size: 12px;
      color: #ff4b4b;
      font-weight: 500;
      margin-top: 6px;
      min-height: 16px;
    }

    #reader-scroll {
      height: {{ pane_height }}px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    .reader-frame {
      font-family: {{ font_family }};
      font-size: {{ font_size }}px;
      {{ theme_style }}
      padding: 1.25rem 1rem 3rem 1rem;
      min-height: 100%;
      word-break: break-word;
    }
    .reader-frame p {
      margin-bottom: 1.35em;
      line-height: 1.8;
    }
    .reader-frame h1, .reader-frame h2, .reader-frame h3 {
      scroll-margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="progress-container">
    <div id="progress-bar"></div>
  </div>

  <div id="toolbar">
    <button id="offlineRestoreBtn" class="ctrl-btn" style="display:none; background:#ff4b4b; color:#fff; border-color:#ff4b4b;">🚇 Restore Cache</button>
    <button id="scrollToggleBtn" class="ctrl-btn">▶️ Start Scroll</button>
    <span class="speed-group">
      <button class="speed-btn" data-ms="70">Slow</button>
      <button class="speed-btn active" data-ms="40">Med</button>
      <button class="speed-btn" data-ms="20">Fast</button>
    </span>
    <button id="ttsBtn" class="ctrl-btn">🔊 Read Aloud</button>
    <button id="settingsBtn" class="ctrl-btn">⚙️ Audio &amp; Timer</button>
  </div>

  <div id="settings-panel">
    <label for="voiceSelect">Voice</label>
    <select id="voiceSelect"></select>

    <label for="rateRange">Speed: <span id="rateLabel">1.0×</span></label>
    <input type="range" id="rateRange" min="0.6" max="1.8" step="0.1" value="1">

    <label for="sleepSelect">Sleep Timer</label>
    <select id="sleepSelect">
      <option value="0">Off</option>
      <option value="5">5 minutes</option>
      <option value="10">10 minutes</option>
      <option value="15">15 minutes</option>
      <option value="30">30 minutes</option>
      <option value="45">45 minutes</option>
      <option value="60">60 minutes</option>
    </select>
    <div id="sleepStatus"></div>
  </div>

  <div id="reader-scroll">
    <div class="reader-frame">
      {{ content }}
    </div>
  </div>

  <script>
    (function () {
      const scrollEl = document.getElementById('reader-scroll');
      const readerFrame = document.querySelector('.reader-frame');
      const bar = document.getElementById('progress-bar');
      const toolbar = document.getElementById('toolbar');
      const scrollToggleBtn = document.getElementById('scrollToggleBtn');
      const ttsBtn = document.getElementById('ttsBtn');
      const settingsBtn = document.getElementById('settingsBtn');
      const offlineRestoreBtn = document.getElementById('offlineRestoreBtn');
      const panel = document.getElementById('settings-panel');
      const voiceSelect = document.getElementById('voiceSelect');
      const rateRange = document.getElementById('rateRange');
      const rateLabel = document.getElementById('rateLabel');
      const sleepSelect = document.getElementById('sleepSelect');
      const sleepStatus = document.getElementById('sleepStatus');
      const speedBtns = document.querySelectorAll('.speed-btn');
      const SETTINGS_LABEL = '⚙️ Audio & Timer';
      const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;

      // ---------- Phone Storage & Subway Persistence ----------
      const CACHE_KEY = 'subway_cached_article';
      const SCROLL_KEY = 'subway_scroll_top';

      try {
        const currentHtml = readerFrame ? readerFrame.innerHTML.trim() : '';
        if (currentHtml && currentHtml.length > 50 && !currentHtml.includes('{{ content }}')) {
          localStorage.setItem(CACHE_KEY, currentHtml);
        } else {
          const cached = localStorage.getItem(CACHE_KEY);
          if (cached && offlineRestoreBtn) {
            offlineRestoreBtn.style.display = 'inline-block';
          }
        }

        const savedScroll = localStorage.getItem(SCROLL_KEY);
        if (savedScroll && scrollEl) {
          scrollEl.scrollTop = parseInt(savedScroll, 10);
        }
      } catch (err) {
        console.warn('Storage quota or private browsing restriction:', err);
      }

      if (offlineRestoreBtn) {
        offlineRestoreBtn.addEventListener('click', function () {
          const cached = localStorage.getItem(CACHE_KEY);
          if (cached && readerFrame) {
            readerFrame.innerHTML = cached;
            updateProgress();
            offlineRestoreBtn.style.display = 'none';
          }
        });
      }

      // ---------- Progress Bar & Position Memory ----------
      function updateProgress() {
        const total = scrollEl.scrollHeight - scrollEl.clientHeight;
        if (total > 0) {
          bar.style.width = (scrollEl.scrollTop / total * 100) + '%';
        }
      }

      scrollEl.addEventListener('scroll', function () {
        updateProgress();
        try {
          localStorage.setItem(SCROLL_KEY, scrollEl.scrollTop);
        } catch (e) {}
      });
      updateProgress();

      // ---------- Auto-scroll Engine ----------
      let scrollTimer = null;
      let scrollSpeedMs = 40;
      let scrollActive = false;

      function startScrolling() {
        if (scrollTimer) clearInterval(scrollTimer);
        scrollTimer = setInterval(function () {
          scrollEl.scrollBy({ top: 1, behavior: 'auto' });
        }, scrollSpeedMs);
      }

      function stopScrolling() {
        if (scrollTimer) {
          clearInterval(scrollTimer);
          scrollTimer = null;
        }
      }

      function setScrollActive(active) {
        scrollActive = active;
        if (active) {
          startScrolling();
          scrollToggleBtn.textContent = '⏸ Pause Scroll';
        } else {
          stopScrolling();
          scrollToggleBtn.textContent = '▶️ Start Scroll';
        }
      }

      scrollToggleBtn.addEventListener('click', function () {
        setScrollActive(!scrollActive);
      });

      speedBtns.forEach(function (btn) {
        btn.addEventListener('click', function () {
          speedBtns.forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          scrollSpeedMs = parseInt(btn.dataset.ms, 10);
          if (scrollActive) startScrolling();
        });
      });

      // ---------- Robust TTS Chunking & Queue Engine ----------
      const ttsFullText = {{ tts_text_json }};
      let ttsChunks = [];
      let ttsIndex = 0;
      let ttsState = 'idle'; // 'idle' | 'playing' | 'paused'
      let ttsSession = 0;

      function setTtsUi() {
        if (ttsState === 'playing') ttsBtn.textContent = '⏸ Pause Reading';
        else if (ttsState === 'paused') ttsBtn.textContent = '▶️ Resume Reading';
        else ttsBtn.textContent = '🔊 Read Aloud';
      }

      function chunkText(text) {
        if (!text) return [];
        const out = [];
        text.split(/\n+/).forEach(function (line) {
          const sentences = line.match(/[^.!?]+[.!?]*/g) || [line];
          let current = '';
          sentences.forEach(function (s) {
            if (current && (current + s).length > 180) {
              out.push(current.trim());
              current = s;
            } else {
              current += s;
            }
          });
          if (current.trim()) out.push(current.trim());
        });
        return out.filter(function (c) { return c.length > 0; });
      }

      function selectedVoice() {
        if (!synth) return null;
        const voices = synth.getVoices();
        return voices.find(function (v) { return v.voiceURI === voiceSelect.value; }) || null;
      }

      function speakNext(session) {
        if (session !== ttsSession) return;
        if (ttsIndex >= ttsChunks.length) {
          ttsState = 'idle';
          ttsIndex = 0;
          setTtsUi();
          return;
        }

        const utter = new SpeechSynthesisUtterance(ttsChunks[ttsIndex]);
        const voice = selectedVoice();
        if (voice) { 
          utter.voice = voice; 
          utter.lang = voice.lang; 
        }
        utter.rate = parseFloat(rateRange.value) || 1.0;
        
        utter.onend = function () {
          if (session !== ttsSession) return;
          ttsIndex += 1;
          speakNext(session);
        };
        utter.onerror = function () {
          if (session !== ttsSession) return;
          ttsState = 'paused';
          setTtsUi();
        };

        synth.speak(utter);
      }

      function speakFrom(index) {
        ttsSession += 1;
        const session = ttsSession;
        if (synth.speaking || synth.pending) {
          synth.cancel();
        }
        ttsIndex = index;
        setTimeout(function () { speakNext(session); }, 50);
      }

      function startTts() {
        ttsChunks = chunkText(ttsFullText);
        if (!ttsChunks.length) return;
        ttsState = 'playing';
        setTtsUi();
        speakFrom(0);
      }

      function pauseTts() {
        ttsSession += 1;
        synth.cancel();
        ttsState = 'paused';
        setTtsUi();
      }

      function resumeTts() {
        ttsState = 'playing';
        setTtsUi();
        speakFrom(ttsIndex);
      }

      if (!synth) {
        ttsBtn.disabled = true;
        ttsBtn.textContent = '🔇 Read Aloud Unavailable';
        voiceSelect.disabled = true;
        rateRange.disabled = true;
      } else {
        ttsBtn.addEventListener('click', function () {
          if (ttsState === 'idle') startTts();
          else if (ttsState === 'playing') pauseTts();
          else resumeTts();
        });
      }

      // ---------- Voice List Population ----------
      function loadVoices() {
        if (!synth) return;
        const voices = synth.getVoices();
        if (!voices.length) return;

        const previous = voiceSelect.value;
        const navLang = (navigator.language || 'en').toLowerCase().split('-')[0];
        const sorted = voices.slice().sort(function (a, b) {
          const am = a.lang.toLowerCase().indexOf(navLang) === 0 ? 0 : 1;
          const bm = b.lang.toLowerCase().indexOf(navLang) === 0 ? 0 : 1;
          return am - bm || a.name.localeCompare(b.name);
        });

        voiceSelect.innerHTML = '';
        sorted.forEach(function (v) {
          const opt = document.createElement('option');
          opt.value = v.voiceURI;
          opt.textContent = v.name + ' (' + v.lang + ')';
          voiceSelect.appendChild(opt);
        });

        const stillThere = sorted.some(function (v) { return v.voiceURI === previous; });
        if (previous && stillThere) {
          voiceSelect.value = previous;
        } else {
          const preferred = sorted.find(function (v) {
            return v.default && v.lang.toLowerCase().indexOf(navLang) === 0;
          }) || sorted[0];
          voiceSelect.value = preferred.voiceURI;
        }
      }

      if (synth) {
        loadVoices();
        if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
        setTimeout(loadVoices, 400);
      }

      function restartIfPlaying() {
        if (synth && ttsState === 'playing') speakFrom(ttsIndex);
      }

      voiceSelect.addEventListener('change', restartIfPlaying);
      rateRange.addEventListener('input', function () {
        rateLabel.textContent = parseFloat(rateRange.value).toFixed(1) + '×';
      });
      rateRange.addEventListener('change', restartIfPlaying);

      // ---------- Settings Modal Positioning & Auto-Dismiss ----------
      settingsBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!panel.classList.contains('open')) {
          panel.style.top = (toolbar.offsetTop + toolbar.offsetHeight + 4) + 'px';
        }
        panel.classList.toggle('open');
      });

      scrollEl.addEventListener('pointerdown', function () {
        if (panel.classList.contains('open')) {
          panel.classList.remove('open');
        }
      });

      // ---------- Sleep Timer Engine ----------
      let sleepEndsAt = 0;
      let sleepInterval = null;

      function formatClock(ms) {
        const total = Math.max(0, Math.round(ms / 1000));
        const m = Math.floor(total / 60);
        const s = total % 60;
        return m + ':' + (s < 10 ? '0' : '') + s;
      }

      function stopEverything() {
        setScrollActive(false);
        if (synth) {
          synth.cancel();
          ttsState = 'idle';
          ttsIndex = 0;
          setTtsUi();
        }
      }

      function clearSleepTimer() {
        if (sleepInterval) { 
          clearInterval(sleepInterval); 
          sleepInterval = null; 
        }
        sleepEndsAt = 0;
        sleepSelect.value = '0';
        sleepStatus.textContent = '';
        settingsBtn.textContent = SETTINGS_LABEL;
      }

      function tickSleep() {
        if (!sleepEndsAt) return;
        const remaining = sleepEndsAt - Date.now();
        if (remaining <= 0) {
          stopEverything();
          clearSleepTimer();
          sleepStatus.textContent = 'Timer ended. Reading stopped.';
          return;
        }
        sleepStatus.textContent = 'Stopping in ' + formatClock(remaining);
        settingsBtn.textContent = '⏲ ' + formatClock(remaining);
      }

      sleepSelect.addEventListener('change', function () {
        const minutes = parseInt(sleepSelect.value, 10);
        if (sleepInterval) { 
          clearInterval(sleepInterval); 
          sleepInterval = null; 
        }
        if (!minutes) {
          clearSleepTimer();
          return;
        }
        sleepEndsAt = Date.now() + (minutes * 60000);
        sleepInterval = setInterval(tickSleep, 1000);
        tickSleep();
      });
    })();
  </script>
</body>
</html>
